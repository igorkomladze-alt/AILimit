name: AILimits
options:
  bundleIdPrefix: local.gutfresh
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""

packages:
  AILimits:
    type: package
    path: .

targets:
  AILimits:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: AILimits
        product: AILimitsMac
      - package: AILimits
        product: AILimitsCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.gutfresh.AILimits
        INFOPLIST_KEY_LSUIElement: true
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: AI Limits
        LSUIElement: true

  AILimitsCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AILimitsCoreTests
    dependencies:
      - package: AILimits
        product: AILimitsCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.gutfresh.AILimits.core-tests
        GENERATE_INFOPLIST_FILE: true

  AILimitsMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AILimitsMacTests
    dependencies:
      - package: AILimits
        product: AILimitsMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.gutfresh.AILimits.mac-tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  AILimits:
    build:
      targets:
        AILimits: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AILimitsCoreTests
        - AILimitsMacTests
